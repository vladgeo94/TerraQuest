[[stages]]
id = "s4"
title = "Drift & keeping state accurate"
lesson = '''
**Drift** = real infrastructure differs from what's in state and config, usually because someone changed it outside Terraform.

### How Terraform detects drift
Every `plan`/`apply` starts with a **refresh**: it asks providers for the current real values and compares them to the configuration.

### Handling drift: two directions
| You want to… | Do this |
|---|---|
| **Undo** the manual change (config is right) | `terraform apply`: Terraform changes reality back to match config |
| **Accept** the manual change (reality is right) | Update your configuration to match, then apply. Or `terraform apply -refresh-only` to just record the new values in state |

### `-refresh-only` mode
- `terraform plan -refresh-only`: shows how **state** would change to match reality, without proposing infrastructure changes
- `terraform apply -refresh-only`: writes those updates to state (after approval)
- Replaces the old `terraform refresh` command, which is deprecated because it updated state without review

### Other state-correction tools
- `terraform apply -replace=ADDR`: re-create something that's broken but looks fine to Terraform
- `terraform import` / `import` block: bring an existing object under management
- `terraform state rm` / `removed` block: stop managing something without destroying it
- `terraform state mv` / `moved` block: rename or move resources in state
- `lifecycle { ignore_changes = [...] }`: deliberately tolerate certain drift

> In this lab, the `local_file` resource treats a hand-edited file as *gone*: the refresh sees that the content no longer matches and plans to re-create it. Cloud resources usually show `~ update in-place` instead.
'''

[[stages.questions]]
type = "single"
q = "Someone manually changed an instance type in the console. You want to keep the manual change. What's the best approach?"
options = [
  "Run `terraform apply`, which keeps manual changes",
  "Update the configuration to match the new value, then plan and apply (no changes expected)",
  "Delete the state file",
  "Run `terraform destroy`",
]
answer = 1
obj = "6d"
explain = "Make config match reality, otherwise the next apply will revert it."

[[stages.questions]]
type = "single"
q = "What does `terraform plan -refresh-only` show?"
options = [
  "Infrastructure changes needed to match config",
  "How state would be updated to match real-world infrastructure, without changing any infrastructure",
  "Only resources that failed",
  "The dependency graph",
]
answer = 1
obj = "6d"
explain = "Refresh-only plans reconcile **state** with reality."

[[stages.questions]]
type = "single"
q = "Which command is deprecated in favor of `terraform apply -refresh-only`?"
options = ["`terraform taint`", "`terraform refresh`", "`terraform state pull`", "`terraform get`"]
answer = 1
obj = "6d"
explain = "`terraform refresh` updated state with no review step. `-refresh-only` lets you review first."

[[stages.questions]]
type = "single"
q = "Drift happened, and the configuration is correct. What restores the intended state?"
options = ["`terraform apply`", "`terraform apply -refresh-only`", "`terraform state rm`", "`terraform fmt`"]
answer = 0
obj = "6d"
explain = "A normal apply changes reality back to match the configuration."

[[stages.questions]]
type = "single"
q = "At what point in a normal `terraform plan` does Terraform detect drift?"
options = ["It never does", "During the refresh at the start of the plan", "Only during `terraform validate`", "Only after apply"]
answer = 1
obj = "6d"
explain = "Plan refreshes state from the real infrastructure first (unless `-refresh=false`)."

