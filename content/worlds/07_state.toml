id = "w7"
order = 7
title = "State Mastery"
subtitle = "Local and remote backends, locking, drift, and CLI workspaces, using a real backend run by the game."
objective = "Objective 6 · Terraform state management"
objective_code = "6"
icon = "🗄️"

[[stages]]
id = "s1"
title = "The local backend"
lesson = '''
A **backend** decides **where state is stored** (and whether it can be locked). If you don't configure one, Terraform uses the **`local` backend**.

```hcl
terraform {
  backend "local" {
    path = "relative/path/to/terraform.tfstate"   # optional; default is terraform.tfstate
  }
}
```

### Local backend facts
- State file: `terraform.tfstate` in the working directory (default)
- Previous version saved as `terraform.tfstate.backup`
- **Locking:** uses the operating system's file locking
- With **CLI workspaces**, non-default workspaces live in `terraform.tfstate.d/<workspace>/terraform.tfstate`
- Fine for learning and solo work; **not** good for teams: no sharing, no central locking, easy to lose, secrets sit on laptops

### Why teams move to remote backends
| Need | Local | Remote (S3, azurerm, gcs, HCP Terraform…) |
|---|---|---|
| Share state with a team | ❌ | ✅ |
| Locking across machines | ❌ | ✅ (most backends) |
| Encryption & access control | Your disk | ✅ |
| Versioning / recovery | Manual | ✅ (e.g. S3 versioning) |
'''

[[stages.questions]]
type = "single"
q = "If no backend is configured, where does Terraform store state?"
options = ["In HCP Terraform", "In `terraform.tfstate` in the working directory (local backend)", "In memory only", "In `~/.terraform.d/state`"]
answer = 1
obj = "6a"
explain = "The default is the `local` backend, writing `terraform.tfstate`."

[[stages.questions]]
type = "fill"
q = "What file holds the previous state version when using the local backend?"
answer = ["terraform.tfstate.backup"]
obj = "6a"
explain = "`terraform.tfstate.backup` is written each time state is updated."

[[stages.questions]]
type = "single"
q = "With the local backend, where is the state for a CLI workspace named `dev` stored?"
options = ["`terraform.tfstate`", "`terraform.tfstate.d/dev/terraform.tfstate`", "`dev.tfstate`", "`.terraform/dev/state`"]
answer = 1
obj = "6a"
explain = "The default workspace uses `terraform.tfstate`. Others go under `terraform.tfstate.d/<name>/`."

[[stages.questions]]
type = "multi"
q = "What are drawbacks of the local backend for teams? (choose 2)"
options = [
  "State isn't shared between team members",
  "No locking across different machines",
  "It can't store more than 10 resources",
  "It doesn't support outputs",
]
answer = [0, 1]
obj = "6a"
explain = "Sharing and cross-machine locking are the big issues. There's no resource limit."

[[stages.questions]]
type = "single"
q = "Which argument changes where the local backend writes state?"
options = ["`file`", "`path`", "`location`", "`state_file`"]
answer = 1
obj = "6a"
explain = "`backend \"local\" { path = \"...\" }`"

[[stages]]
id = "s2"
title = "State locking"
lesson = '''
**Locking** stops two people (or pipelines) from writing the same state at the same time, which could corrupt it or lose changes.

- Terraform **automatically** acquires a lock for any operation that could write state (`plan`, `apply`, `destroy`, `state` commands…)
- If someone else holds the lock, your command fails (or waits, see `-lock-timeout`)
- **Not all backends support locking.** Check the backend docs

| Backend | Locking |
|---|---|
| local | ✅ OS file locks |
| s3 | ✅ `use_lockfile = true` (native S3 locking, 1.10+); DynamoDB table (older, deprecated) |
| azurerm | ✅ blob leases |
| gcs | ✅ |
| HCP Terraform | ✅ |
| http | ✅ optional (`lock_address`) |

### Useful flags & commands
| | |
|---|---|
| `-lock-timeout=60s` | Wait up to 60s for the lock instead of failing immediately |
| `-lock=false` | Don't lock (**dangerous**, avoid) |
| `terraform force-unlock LOCK_ID` | Manually release a **stuck** lock (e.g. a crashed CI job) |

> ⚠️ Only `force-unlock` when you're **sure** nobody is still running. You need the **lock ID** shown in the error message.
'''

[[stages.questions]]
type = "single"
q = "What is the purpose of state locking?"
options = [
  "To encrypt state",
  "To prevent concurrent operations from writing the same state and corrupting it",
  "To stop people from reading outputs",
  "To pin provider versions",
]
answer = 1
obj = "6b"
explain = "Locking serializes writes to state."

[[stages.questions]]
type = "fill"
q = "A CI job crashed and left the state locked with ID `9db590f1`. Which command releases it? (full command)"
answer = ["terraform force-unlock 9db590f1"]
obj = "6b"
explain = "`terraform force-unlock <LOCK_ID>`. Make sure nothing is really running first."

[[stages.questions]]
type = "single"
q = "Do all backends support state locking?"
options = ["Yes", "No, it depends on the backend", "Only remote backends do", "Only HCP Terraform does"]
answer = 1
obj = "6b"
explain = "Most popular backends do, but you must check each backend's documentation."

[[stages.questions]]
type = "single"
q = "You want `terraform apply` to wait up to 5 minutes for a lock held by a colleague instead of failing. Which flag?"
options = ["`-lock=false`", "`-lock-timeout=5m`", "`-wait=5m`", "`-parallelism=5`"]
answer = 1
obj = "6b"
explain = "`-lock-timeout` retries acquiring the lock for that duration."

[[stages.questions]]
type = "single"
q = "Since Terraform 1.10, how can the S3 backend lock state without DynamoDB?"
options = ["`use_lockfile = true`", "`lock = \"s3\"`", "`dynamodb_table = \"none\"`", "It can't"]
answer = 0
obj = "6b"
explain = "`use_lockfile = true` uses an S3 lock object. The DynamoDB-based locking is deprecated."

[[stages.questions]]
type = "single"
q = "Is it automatic, or do you have to request a lock before running `terraform apply`?"
options = ["You must run `terraform lock` first", "It's automatic for operations that could write state", "Only with `-lock=true`", "Only in HCP Terraform"]
answer = 1
obj = "6b"
explain = "Terraform locks automatically if the backend supports it."

[[stages]]
id = "s3"
title = "Remote state with the backend block"
lesson = '''
```hcl
terraform {
  backend "s3" {
    bucket       = "acme-terraform-state"
    key          = "network/prod/terraform.tfstate"
    region       = "eu-central-1"
    encrypt      = true
    use_lockfile = true
  }
}
```

### Rules for the `backend` block
- Goes **inside the `terraform` block**; only **one** backend per configuration
- **Cannot use variables, locals or data sources**: values must be literals
- Missing values can be supplied at init time = **partial configuration**:
  ```bash
  terraform init -backend-config="bucket=acme-state" -backend-config=backend.hcl
  ```
  (great for keeping secrets out of code and reusing one config across environments)
- After adding or changing a backend you **must** run `terraform init`
  - `-migrate-state`: copy existing state to the new backend
  - `-reconfigure`: start fresh and ignore the old state
- Removing the backend block and running `init -migrate-state` moves state back to local
- Can't be combined with a `cloud` block (HCP Terraform uses `cloud` instead)

### Reading another configuration's state
```hcl
data "terraform_remote_state" "network" {
  backend = "s3"
  config = {
    bucket = "acme-terraform-state"
    key    = "network/prod/terraform.tfstate"
    region = "eu-central-1"
  }
}
# use: data.terraform_remote_state.network.outputs.vpc_id
```
Only the **root module outputs** of the other state are accessible. (The reader needs access to the whole state, so prefer purpose-built data sources or HCP Terraform's `tfe_outputs` when possible.)

### This game runs a real backend!
TerraQuest serves Terraform's **`http` backend** at `/tfstate/<name>`, with locking. You'll migrate state into it in the next lab.
'''

[[stages.questions]]
type = "single"
q = "Can you use `var.bucket_name` inside a `backend \"s3\"` block?"
options = ["Yes", "No; backend blocks can't use variables, so use partial configuration with `-backend-config` instead", "Only with `TF_VAR_`", "Only in HCP Terraform"]
answer = 1
obj = "6c"
explain = "The backend is configured before variables are evaluated. Use `-backend-config` for dynamic values."

[[stages.questions]]
type = "single"
q = "What is **partial backend configuration**?"
options = [
  "Storing half the state locally",
  "Leaving some backend arguments out of the code and supplying them with `terraform init -backend-config=...`",
  "Using two backends at once",
  "A backend without locking",
]
answer = 1
obj = "6c"
explain = "It keeps secrets and environment-specific values out of the config."

[[stages.questions]]
type = "single"
q = "You just added an S3 backend to a project that already has local state. What do you run to move the state?"
options = ["`terraform apply`", "`terraform init -migrate-state`", "`terraform state push`", "`terraform init -reconfigure`"]
answer = 1
obj = "6c"
explain = "`init` detects the backend change, and `-migrate-state` copies the state across."

[[stages.questions]]
type = "fill"
q = "Which data source reads root-module outputs from another configuration's state?"
answer = ["terraform_remote_state"]
obj = "6c"
explain = "`data \"terraform_remote_state\" \"x\" { backend = \"...\" config = { ... } }` → `.outputs.<name>`"

[[stages.questions]]
type = "single"
q = "How many backend blocks can a configuration have?"
options = ["One", "One per provider", "One per module", "Unlimited"]
answer = 0
obj = "6c"
explain = "Exactly one backend (or one `cloud` block) per configuration."

[[stages.questions]]
type = "single"
q = "From `data.terraform_remote_state.net`, which values can you read?"
options = ["Any resource attribute in that state", "Only the root module outputs of that state", "Only variables", "Only data sources"]
answer = 1
obj = "6c"
explain = "`.outputs.<name>`: root-level outputs only."

[[stages]]
id = "lab1"
