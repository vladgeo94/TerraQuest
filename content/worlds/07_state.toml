[[stages]]
id = "s5"
title = "CLI workspaces"
lesson = '''
**CLI workspaces** let one configuration keep **multiple separate states** in the same backend.

```bash
terraform workspace list          # * marks the current one
terraform workspace new dev       # create and switch
terraform workspace select prod   # switch
terraform workspace show          # print current name
terraform workspace delete dev    # delete (must be empty, and not the current one)
```

- Every backend starts with the **`default`** workspace, which **cannot be deleted**
- Reference the current name in config: **`terraform.workspace`**
  ```hcl
  resource "aws_instance" "web" {
    instance_type = terraform.workspace == "prod" ? "m5.large" : "t3.micro"
    tags = { Env = terraform.workspace }
  }
  ```
- Local backend: `terraform.tfstate.d/<name>/terraform.tfstate`
- `TF_WORKSPACE=prod` env var selects a workspace (handy in CI)

### When to use them
Good for quick parallel copies (testing a feature branch). HashiCorp **doesn't** recommend CLI workspaces as the main way to separate environments with different credentials or access controls. Use separate configurations/backends, or HCP Terraform workspaces.

> ⚠️ **HCP Terraform workspaces are different!** An HCP Terraform workspace is a full unit with its own state, variables, permissions and run history. More in the HCP Terraform world.
'''

[[stages.questions]]
type = "single"
q = "What is the name of the workspace every backend starts with?"
options = ["`main`", "`default`", "`prod`", "`root`"]
answer = 1
obj = "6a"
explain = "`default`, and it can't be deleted."

[[stages.questions]]
type = "fill"
q = "Which expression returns the current workspace name inside configuration?"
answer = ["terraform.workspace"]
obj = "6a"
explain = "`terraform.workspace`"

[[stages.questions]]
type = "single"
q = "What does `terraform workspace new staging` do?"
options = [
  "Copies the current state into staging",
  "Creates an empty workspace named staging and switches to it",
  "Creates a new folder",
  "Creates an HCP Terraform workspace",
]
answer = 1
obj = "6a"
explain = "New workspaces start with empty state, and you're switched to them."

[[stages.questions]]
type = "single"
q = "Are CLI workspaces recommended for isolating environments that need different credentials and access controls?"
options = [
  "Yes, that's their main purpose",
  "No; use separate configurations/backends or HCP Terraform workspaces for strong isolation",
  "Only with the S3 backend",
  "Only for prod",
]
answer = 1
obj = "6a"
explain = "CLI workspaces share the same backend and credentials, so the isolation is weak."

