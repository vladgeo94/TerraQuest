[[stages]]
id = "boss"
title = "Boss: The State Leviathan"
boss = true
lesson = "The Leviathan guards the state file. Backends, locks, drift, workspaces. 80% to pass."

[[stages.questions]]
type = "single"
q = "Two engineers run `terraform apply` at the same moment against an S3 backend with locking enabled. What happens?"
options = [
  "Both applies run and the last write wins",
  "One acquires the lock; the other fails with a lock error (or waits if `-lock-timeout` is set)",
  "Terraform merges the two plans",
  "The state is corrupted",
]
answer = 1
obj = "6b"
explain = "That's exactly what locking prevents."

[[stages.questions]]
type = "single"
q = "Your backend block has `bucket = var.state_bucket`. What happens on `terraform init`?"
options = ["It works", "Error: variables are not allowed in backend configuration", "It prompts for the bucket", "It falls back to local"]
answer = 1
obj = "6c"
explain = "Use `-backend-config=\"bucket=...\"` instead."

[[stages.questions]]
type = "single"
q = "You want to move from an S3 backend back to local state. What do you do?"
options = [
  "Delete the S3 bucket",
  "Remove the backend block and run `terraform init -migrate-state`",
  "`terraform state pull > terraform.tfstate` is the only way",
  "It's impossible",
]
answer = 1
obj = "6c"
explain = "Removing the backend means local, and `init -migrate-state` copies the state back."

[[stages.questions]]
type = "single"
q = "A colleague tagged resources by hand. You want those tag values recorded in state, but you don't want any infrastructure changes. Which command?"
options = ["`terraform apply`", "`terraform apply -refresh-only`", "`terraform import`", "`terraform state push`"]
answer = 1
obj = "6d"
explain = "Refresh-only updates state to match reality. (Update the config too, or the next apply reverts the tags.)"

[[stages.questions]]
type = "single"
q = "Which statement about `terraform force-unlock` is TRUE?"
options = [
  "It runs automatically after every apply",
  "It requires the lock ID and should only be used when you're sure no operation is running",
  "It deletes the state",
  "It only works with the local backend",
]
answer = 1
obj = "6b"
explain = "Forcing an unlock while someone is applying risks corrupting state."

[[stages.questions]]
type = "single"
q = "Which file would hold the state of a CLI workspace `qa` with the local backend?"
options = ["`qa.tfstate`", "`terraform.tfstate.d/qa/terraform.tfstate`", "`.terraform/qa.tfstate`", "`terraform.tfstate` (shared)"]
answer = 1
obj = "6a"
explain = "Non-default workspaces go under `terraform.tfstate.d/`."

[[stages.questions]]
type = "multi"
q = "Which commands can detect drift? (choose 2)"
options = ["`terraform plan`", "`terraform plan -refresh-only`", "`terraform fmt`", "`terraform validate`"]
answer = [0, 1]
obj = "6d"
explain = "Both refresh against real infrastructure. fmt and validate never contact providers."

[[stages.questions]]
type = "single"
q = "`terraform init -backend-config=prod.s3.hcl` is an example of:"
options = ["State migration", "Partial backend configuration", "Workspace selection", "Module installation"]
answer = 1
obj = "6c"
explain = "Supplying backend settings outside the `backend` block."

[[stages.questions]]
type = "single"
q = "Why is storing state in a remote backend with encryption recommended?"
options = [
  "State may contain secrets in plain text",
  "Encrypted state makes plans faster",
  "Terraform refuses to run otherwise",
  "It removes the need for locking",
]
answer = 0
obj = "6c"
explain = "State can contain passwords, keys and so on. Protect it."
