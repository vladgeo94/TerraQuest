[[stages]]
id = "s3"
title = "Workspaces & projects"
lesson = '''
### Hierarchy
```
Organization
 └── Project  (e.g. "payments")
      ├── Workspace: payments-network-prod
      ├── Workspace: payments-app-prod
      └── Workspace: payments-app-staging
```

### HCP Terraform workspaces
A workspace is how HCP Terraform organizes infrastructure. Each one has its **own**:
- **State** (and state history)
- **Variables**: Terraform variables and **environment variables**, optionally **sensitive** (write-only in the UI/API)
- **Run history**, settings (Terraform version, execution mode, auto-apply, VCS repo + working directory)
- **Access permissions**

Best practice: split infrastructure into **small workspaces** by component and environment (e.g. network vs app, staging vs prod), which limits blast radius and allows different access.

> ⚠️ **Not the same as CLI workspaces!** CLI workspaces are just multiple state files for one config in one backend. HCP Terraform workspaces are full units with their own variables, permissions and runs.

### Projects
- Group related workspaces (by team, application or business unit)
- Grant **team permissions at the project level**, so they apply to every workspace inside
- Scope **variable sets** and **policy sets** to projects

### Connecting workspaces
- **Run triggers:** when workspace A applies successfully, automatically queue a run in workspace B (e.g. network → app)
- **Sharing outputs:** a workspace can allow others to read its state outputs; consumers use the `tfe_outputs` data source (from the `tfe` provider) or `terraform_remote_state`
- **Variable sets:** apply the same variables to many workspaces, globally or by project

### Variable precedence in HCP Terraform (simplified)
Workspace-specific variables override variable sets. Among variable sets, project-scoped ones override global ones, and **priority variable sets** override everything (including workspace variables and CLI `-var`).
'''

