[[stages]]
id = "s4"
title = "Configuring the HCP Terraform integration"
lesson = '''
### 1. Authenticate
```bash
terraform login              # opens the browser, creates an API token
```
The token is saved to `~/.terraform.d/credentials.tfrc.json`. In CI, set the token through an environment variable instead:
`TF_TOKEN_app_terraform_io=<token>` (dots in the hostname become underscores).

### 2. Add a `cloud` block (Terraform 1.1+)
```hcl
terraform {
  cloud {
    organization = "acme"
    # hostname   = "app.terraform.io"   # default; set it for Terraform Enterprise

    workspaces {
      name = "payments-app-prod"        # one specific workspace
      # tags    = ["payments", "app"]   # OR: any workspace with these tags
      # project = "payments"
    }
  }
}
```
- Can't be combined with a `backend` block
- Values can come from env vars: `TF_CLOUD_ORGANIZATION`, `TF_CLOUD_HOSTNAME`, `TF_CLOUD_PROJECT`, `TF_WORKSPACE`
- With `tags`, use `terraform workspace list` / `select` to choose among the matching workspaces

### 3. `terraform init`
Connects to HCP Terraform. If you had local (or other backend) state, init offers to **migrate it** into the workspace.

### 4. Plan and apply
- `terraform plan` starts a **speculative plan** remotely and streams it
- `terraform apply` runs remotely (when the workspace uses remote execution) and asks for confirmation in the terminal or the UI
- Variables come from the **workspace/variable sets**, not your local `terraform.tfvars` (for remote runs, `*.auto.tfvars` files uploaded with the config are still read)

### API tokens
| Token | Scope |
|---|---|
| User token | Acts as the user (`terraform login` creates one) |
| Team token | Acts as a team (common for CI) |
| Organization token | Manages organization settings, workspaces, teams; **can't** start runs |
| Audit trail token | Reads audit events only |
'''

[[stages.questions]]
type = "fill"
q = "Which command authenticates the Terraform CLI with HCP Terraform and stores an API token?"
answer = ["terraform login"]
obj = "8d"
explain = "`terraform login` (and `terraform logout` removes it)."

[[stages.questions]]
type = "single"
q = "Which block connects a configuration to HCP Terraform (Terraform 1.1+)?"
options = ["`backend \"hcp\"`", "`cloud { organization = ... workspaces { ... } }` inside the `terraform` block", "`provider \"tfe\"`", "`hcp { }` at the top level"]
answer = 1
obj = "8d"
explain = "The `cloud` block. (The older `backend \"remote\"` still exists, but `cloud` is the recommended way.)"

[[stages.questions]]
type = "single"
q = "Where does `terraform login` save the API token by default?"
options = ["`.terraform.lock.hcl`", "`~/.terraform.d/credentials.tfrc.json`", "`terraform.tfvars`", "`/etc/terraform/token`"]
answer = 1
obj = "8d"
explain = "`~/.terraform.d/credentials.tfrc.json` (CLI configuration can change it)."

[[stages.questions]]
type = "fill"
q = "Which environment variable provides an API token for `app.terraform.io` in CI?"
answer = ["TF_TOKEN_app_terraform_io"]
case_sensitive = true
obj = "8d"
explain = "`TF_TOKEN_<hostname with dots replaced by underscores>`."

[[stages.questions]]
type = "single"
q = "Can a configuration contain both a `cloud` block and a `backend` block?"
options = ["Yes", "No, they are mutually exclusive", "Only for Terraform Enterprise", "Only with workspaces tags"]
answer = 1
obj = "8d"
explain = "Use one or the other."

[[stages.questions]]
type = "single"
q = "You add a `cloud` block to a project that already has local state and run `terraform init`. What happens?"
options = [
  "Local state is deleted",
  "Terraform offers to migrate the existing state into the HCP Terraform workspace",
  "Init fails",
  "HCP Terraform re-creates all resources",
]
answer = 1
obj = "8d"
explain = "Init detects the change and migrates state into the workspace."

[[stages.questions]]
type = "single"
q = "In the `cloud` block, what does `workspaces { tags = [\"app\"] }` do?"
options = [
  "Creates a workspace named app",
  "Lets the configuration use any workspace tagged `app`; you pick one with `terraform workspace select`",
  "Tags all resources with app",
  "Restricts the plan to tagged resources",
]
answer = 1
obj = "8d"
explain = "Tag-based selection maps the config to multiple workspaces."

[[stages.questions]]
type = "single"
q = "Which token type can manage organization settings but cannot start runs?"
options = ["User token", "Team token", "Organization token", "Audit trail token"]
answer = 2
obj = "8d"
explain = "Organization tokens are for managing the organization (creating workspaces, teams…), not for runs."

