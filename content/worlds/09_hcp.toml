[[stages]]
id = "s2"
title = "Collaboration & governance"
lesson = '''
### Collaboration
- **Organizations** contain everything: projects, workspaces, teams, registry, policies
- **Teams & permissions:** users belong to teams; teams get permissions at the organization, **project** or workspace level
  - Workspace permission levels: **Read**, **Plan**, **Write**, **Admin** (plus custom permissions)
  - The **owners** team has full control of the organization
- **Run history & audit:** every run, who triggered it, what changed
- **Notifications:** Slack, email, Microsoft Teams, webhooks
- **SSO** (SAML/OIDC) and audit logs for enterprises

### Governance
- **Policy as code** with **Sentinel** or **OPA** (Open Policy Agent), grouped in **policy sets** and applied to the organization, projects or specific workspaces
  - Policies run **after the plan, before apply**
  - Sentinel enforcement levels: **advisory** (warn), **soft-mandatory** (fail, but authorized users can override), **hard-mandatory** (fail, no override)
  - OPA levels: advisory, mandatory
  - Examples: "only approved instance types", "all resources must have a `cost-center` tag"
- **Run tasks:** integrate third-party tools (security scanners, cost tools…) at pre-plan, post-plan, pre-apply or post-apply stages
- **Cost estimation:** estimated monthly cost change in the run (supported resources)
- **Private registry:** publish modules and providers internally; **no-code provisioning** lets non-experts deploy approved modules without writing HCL
- **Health assessments:** scheduled **drift detection** and **continuous validation** (re-checks `check` blocks and conditions)
- **Variable sets:** share variables (like cloud credentials) across many workspaces/projects
- **Dynamic provider credentials:** OIDC-based short-lived credentials for AWS/Azure/GCP/Vault, so no static keys are stored
'''

