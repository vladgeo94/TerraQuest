[[stages]]
id = "s1"
title = "Creating infrastructure with HCP Terraform"
lesson = '''
**HCP Terraform** (formerly *Terraform Cloud*) is HashiCorp's SaaS platform for running Terraform as a team, at `app.terraform.io`. **Terraform Enterprise** is the self-hosted edition with largely the same features.

### What it gives you
- **Remote state** storage with locking, versioning and encryption
- **Remote runs**: plans and applies execute on HCP Terraform's workers, not your laptop
- A UI with run history, logs and approvals
- Variables (including sensitive ones), team access control, policies, private registry…

### Three ways to trigger runs (workflows)
| Workflow | How runs start |
|---|---|
| **VCS-driven** | Connect a workspace to a Git repo. Pushes to the branch queue plan+apply; **pull requests get speculative plans** |
| **CLI-driven** | Add a `cloud` block, run `terraform plan`/`apply` locally; the run executes remotely and streams output to your terminal |
| **API-driven** | Your own tooling uploads configuration versions and creates runs through the API |

### Anatomy of a run
1. **Plan** (queued → planning)
2. **Cost estimation** (for supported resources, where enabled)
3. **Policy checks** (Sentinel / OPA)
4. **Run tasks** (third-party integrations can hook into stages)
5. **Apply**: requires **confirmation** in the UI unless the workspace has **auto-apply** enabled

**Speculative plans** are plan-only runs that can't be applied. They're used for PRs and for `terraform plan` from the CLI.

### Execution modes (per workspace)
| Mode | Where Terraform runs | State |
|---|---|---|
| **Remote** (default) | HCP Terraform workers | HCP Terraform |
| **Local** | Your machine | HCP Terraform (used only as a state backend) |
| **Agent** | Your self-hosted **HCP Terraform agents** (e.g. inside a private network) | HCP Terraform |

> 🧪 **Want hands-on?** Create a free account at app.terraform.io, run `terraform login` in your own terminal, then add a `cloud` block to any lab config from earlier worlds and run `terraform init`. (Labs here can't run `terraform login` for you.)
'''

