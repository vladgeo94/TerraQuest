[[stages]]
id = "s4"
title = "Terraform state"
lesson = '''
**State** is Terraform's database of the real objects it manages. By default it's a JSON file named **`terraform.tfstate`** in your working directory.

### Why state exists
- **Mapping:** links `aws_instance.web` in your config to the real instance ID `i-0abc123…`
- **Metadata:** tracks dependencies so Terraform knows how to destroy things in the right order, even after you remove them from config
- **Performance:** caches attribute values, which helps on large infrastructures
- **Syncing:** shared (remote) state lets a team work on the same infrastructure

### How state is used during a run
1. **Refresh:** read the current real-world values of everything in state
2. **Diff:** compare desired (config) against current (refreshed state)
3. **Plan/apply:** make the changes, then **write the new state**

### Rules of thumb
- **Don't edit state by hand.** Use `terraform state …` commands (covered later).
- State can contain **secrets in plain text** (passwords, keys). Protect it; for teams use a remote backend with encryption and access control.
- `terraform.tfstate.backup` holds the previous version (local backend).
- For teams: **remote state** (S3, Azure Blob, GCS, HCP Terraform…) with **locking**.

> 📝 Marking a variable `sensitive = true` hides it in CLI output, but it is **still stored in state**.
'''

[[stages.questions]]
type = "single"
q = "What is the default name of Terraform's local state file?"
options = ["`state.json`", "`terraform.tfstate`", "`.terraform/state`", "`terraform.state.hcl`"]
answer = 1
obj = "2d"
explain = "The local backend writes `terraform.tfstate` (and keeps `terraform.tfstate.backup`)."

[[stages.questions]]
type = "multi"
q = "Why does Terraform need state? (choose 3)"
options = [
  "To map configuration resources to real-world objects",
  "To track metadata such as dependencies",
  "To improve performance by caching attribute values",
  "To store your provider plugin binaries",
  "To replace version control",
]
answer = [0, 1, 2]
obj = "2d"
explain = "Mapping, metadata and performance (plus team syncing with remote state)."

[[stages.questions]]
type = "single"
q = "A variable is marked `sensitive = true`. Is its value stored in the state file?"
options = [
  "No, sensitive values are never written to state",
  "Yes, state can still contain it in plain text, so state must be protected",
  "Only if you use `-show-sensitive`",
  "Only in remote state",
]
answer = 1
obj = "2d"
explain = "`sensitive` only redacts CLI/UI output. Protect state with encrypted, access-controlled storage."

[[stages.questions]]
type = "single"
q = "What is the recommended way to change Terraform state?"
options = [
  "Edit `terraform.tfstate` in a text editor",
  "Use `terraform state` subcommands, `import`/`moved`/`removed` blocks, or normal plan/apply",
  "Delete the state file and re-apply",
  "Email HashiCorp support",
]
answer = 1
obj = "2d"
explain = "Hand-editing JSON is risky. Use the CLI and configuration-driven refactoring blocks."

[[stages.questions]]
type = "order"
q = "Order what Terraform does during `terraform apply` (default settings):"
items = [
  "Refresh: read the real-world state of managed resources",
  "Compare refreshed state with the configuration",
  "Show the plan and wait for approval",
  "Make the API calls to create/update/delete",
  "Write the updated state",
]
obj = "2d"
explain = "Refresh → diff → plan/approve → apply → save state."

[[stages.questions]]
type = "single"
q = "Why is remote state recommended for teams?"
options = [
  "It makes plans faster by skipping refresh",
  "Everyone shares one up-to-date state, with locking and access control",
  "It removes the need for providers",
  "Remote state is not stored as JSON",
]
answer = 1
obj = "2d"
explain = "A shared, locked, secured state avoids conflicting changes and lost updates."

[[stages]]
id = "boss"
title = "Boss: The Plugin Hydra"
boss = true
lesson = "Every head of the Hydra asks about providers, versions or state. 80% to pass."

[[stages.questions]]
type = "single"
q = "Your config says `version = \">= 2.0, < 2.5\"`. The lock file pins 2.3.1, and 2.4.0 has been released. What does a plain `terraform init` select?"
options = ["2.4.0", "2.3.1", "The latest 2.x", "It fails with a conflict"]
answer = 1
obj = "2a"
explain = "The lock file wins until you run `terraform init -upgrade`."

[[stages.questions]]
type = "single"
q = "Which constraint allows 1.4.0 through 1.4.x but blocks 1.5.0?"
options = ['`"~> 1.4"`', '`"~> 1.4.0"`', '`">= 1.4"`', '`"= 1.4"`']
answer = 1
obj = "2a"
explain = "`~> 1.4.0` = `>= 1.4.0, < 1.5.0`."

[[stages.questions]]
type = "single"
q = "Which block declares that a configuration needs the `hashicorp/azurerm` provider?"
options = ["`provider \"azurerm\" { source = ... }`", "`required_providers` inside the `terraform` block", "`module \"azurerm\"`", "`data \"provider\" \"azurerm\"`"]
answer = 1
obj = "2a"
explain = "Source and version go in `terraform { required_providers { ... } }`. The `provider` block holds settings like region."

[[stages.questions]]
type = "fill"
q = "Resource `aws_instance.us_web` must use `provider \"aws\" { alias = \"virginia\" ... }`. What value goes in its `provider` argument?"
answer = ["aws.virginia"]
obj = "2c"
explain = "`provider = aws.virginia`"

[[stages.questions]]
type = "single"
q = "What happens if you lose your local `terraform.tfstate` file (and have no backup)?"
options = [
  "Nothing; Terraform rebuilds it from the provider",
  "Terraform no longer knows it manages those resources and would try to create them again",
  "Terraform destroys everything automatically",
  "The configuration becomes invalid",
]
answer = 1
obj = "2d"
explain = "Without state Terraform has no mapping to real objects. You'd need to `import` them back. This is why remote state with versioning matters."

[[stages.questions]]
type = "single"
q = "Which provider tier is built and maintained by third-party technology companies that are verified by HashiCorp?"
options = ["Official", "Partner", "Community", "Archived"]
answer = 1
obj = "2b"
explain = "Partner providers are maintained by the company that owns the technology, for example Datadog or MongoDB."

[[stages.questions]]
type = "multi"
q = "Which files or folders appear after `terraform init` in a new project? (choose 2)"
options = ["`.terraform/`", "`.terraform.lock.hcl`", "`terraform.tfstate`", "`terraform.tfvars`"]
answer = [0, 1]
obj = "2a"
explain = "`init` creates `.terraform/` and the lock file. State appears after the first apply; tfvars files are written by you."

[[stages.questions]]
type = "single"
q = "Terraform needs state to map config to real resources. Which of these is ALSO true?"
options = [
  "State is optional if you use tags",
  "State is used to determine resource dependencies for correct destroy ordering",
  "State is only needed for HCP Terraform",
  "State stores your `.tf` source code",
]
answer = 1
obj = "2d"
explain = "State records dependency metadata, so Terraform can destroy resources in the right order even after their config is gone."

[[stages.questions]]
type = "single"
q = "Where does `terraform init` place provider plugins for the project?"
options = ["`~/.terraform.d/plugins` always", "`.terraform/providers` in the working directory", "`/opt/terraform/providers`", "Inside `.terraform.lock.hcl`"]
answer = 1
obj = "2a"
explain = "Into `.terraform/providers/…` (optionally linked from a plugin cache set with `TF_PLUGIN_CACHE_DIR`)."
