id = "w2"
order = 2
title = "Providers & State"
subtitle = "Install and pin providers, combine several of them, and understand Terraform state."
objective = "Objective 2 · Terraform fundamentals"
objective_code = "2"
icon = "🔌"

[[stages]]
id = "s1"
title = "How Terraform uses providers"
lesson = '''
Terraform is split in two:

- **Terraform core** (the `terraform` binary): reads config, builds the dependency graph, makes plans, manages state.
- **Providers**: separate plugin binaries that know how to talk to one API. Core talks to them over **RPC (gRPC)**.

```
terraform (core)  ⇄  provider plugin  ⇄  platform API (AWS, GitHub, …)
```

A provider gives you:
- **Resource types** (`aws_instance`, `local_file`): things to create/manage
- **Data sources** (`data "aws_ami"`): things to *read*
- Sometimes **functions** (provider-defined functions, called like `provider::aws::arn_parse(...)`)
- Sometimes **ephemeral resources** (short-lived values that aren't stored in state, Terraform 1.10+)

### Provider tiers in the Registry
| Tier | Who maintains it |
|---|---|
| **Official** | HashiCorp |
| **Partner** | Third-party companies, verified by HashiCorp |
| **Community** | Individuals and community members |
| *(Archived)* | No longer maintained |

### Configuring a provider

```hcl
provider "aws" {
  region = "eu-central-1"
}
```

The `provider` block holds settings like region or credentials. Many providers can also read settings from environment variables (e.g. `AWS_REGION`). **Don't hard-code secrets** in provider blocks.

> 📝 Providers are versioned and released **separately** from Terraform itself.
'''

[[stages.questions]]
type = "single"
q = "How does Terraform core communicate with provider plugins?"
options = ["Through shared memory", "Over RPC (gRPC)", "By reading each other's log files", "Through HTTP calls to registry.terraform.io"]
answer = 1
obj = "2b"
explain = "Providers are separate executables. Core launches them and talks to them via gRPC."

[[stages.questions]]
type = "single"
q = "Which provider tier is maintained by HashiCorp?"
options = ["Community", "Partner", "Official", "Verified"]
answer = 2
obj = "2b"
explain = "**Official** providers are owned and maintained by HashiCorp. **Partner** providers are maintained by technology partners."

[[stages.questions]]
type = "multi"
q = "What can a provider contribute to Terraform? (choose 3)"
options = ["Resource types", "Data sources", "Functions", "New HCL keywords like `loop`", "Backends for state"]
answer = [0, 1, 2]
obj = "2b"
explain = "Providers supply resources, data sources and (since 1.8) functions. Backends are built into Terraform core."

[[stages.questions]]
type = "single"
q = "Are providers released together with Terraform?"
options = [
  "Yes, every Terraform release bundles all providers",
  "No, providers are versioned and released independently",
  "Only official providers are bundled",
  "Only on major versions",
]
answer = 1
obj = "2b"
explain = "Providers have their own release cycle. That's why you pin them separately."

[[stages.questions]]
type = "single"
q = "What is the safest way to give the AWS provider credentials?"
options = [
  "Hard-code `access_key` and `secret_key` in the provider block",
  "Use environment variables, shared credentials files, or workload identity instead of hard-coding",
  "Put them in a resource's `tags`",
  "Commit them to `terraform.tfvars` in Git",
]
answer = 1
obj = "2b"
explain = "Keep secrets out of code. Use env vars, credential files, IAM roles / OIDC, or dynamic credentials."

[[stages]]
id = "s2"
title = "Installing & versioning providers"
lesson = '''
You declare the providers you need inside the `terraform` block:

```hcl
terraform {
  required_version = ">= 1.5.0"        # Terraform CLI version constraint

  required_providers {
    aws = {
      source  = "hashicorp/aws"         # <NAMESPACE>/<TYPE>
      version = "~> 5.0"
    }
  }
}
```

- `source = "hashicorp/aws"` is short for `registry.terraform.io/hashicorp/aws` (hostname/namespace/type).
- `terraform init` downloads matching versions into `.terraform/providers/`.

### Version constraint operators

| Constraint | Means |
|---|---|
| `= 1.2.0` or `1.2.0` | exactly 1.2.0 |
| `!= 1.2.0` | anything but 1.2.0 |
| `>= 1.2.0`, `> `, `<`, `<=` | comparisons |
| `~> 1.2.0` | **pessimistic**: `>= 1.2.0, < 1.3.0` (patch updates only) |
| `~> 1.2` | `>= 1.2, < 2.0` (minor updates allowed) |
| `>= 1.2, < 2.0` | combine with commas |

### The dependency lock file: `.terraform.lock.hcl`
- Created/updated by `terraform init`
- Records the **exact provider versions** selected, plus checksums (hashes)
- Future `init`s reuse those exact versions, even if newer ones match your constraint
- **Commit it to Git**
- It tracks **providers only**, not modules
- To move to newer versions within your constraints: `terraform init -upgrade`

> 📝 **Exam favourite:** `~> 1.2.0` allows 1.2.x only; `~> 1.2` allows 1.x (≥ 1.2).
'''

[[stages.questions]]
type = "single"
q = "Which versions does `version = \"~> 3.1.0\"` allow?"
options = ["3.1.0 only", ">= 3.1.0 and < 3.2.0", ">= 3.1.0 and < 4.0.0", "Any 3.x version"]
answer = 1
obj = "2a"
explain = "With three parts, `~>` only lets the **last** part increase: 3.1.0, 3.1.1, 3.1.9… but not 3.2.0."

[[stages.questions]]
type = "single"
q = "Which versions does `version = \"~> 3.1\"` allow?"
options = ["3.1.x only", ">= 3.1 and < 4.0", ">= 3.0 and < 3.2", "Exactly 3.1"]
answer = 1
obj = "2a"
explain = "With two parts, the minor version may increase: 3.1, 3.2 … 3.99, but not 4.0."

[[stages.questions]]
type = "fill"
q = "Which file records the exact provider versions and checksums chosen during `terraform init`?"
answer = [".terraform.lock.hcl", "terraform.lock.hcl"]
placeholder = ".terraform....."
obj = "2a"
explain = "The **dependency lock file** `.terraform.lock.hcl`. Commit it."

[[stages.questions]]
type = "fill"
q = "A newer provider version exists that satisfies your constraint, but the lock file pins an older one. Which command upgrades it? (full command)"
answer = ["terraform init -upgrade", "terraform init --upgrade"]
obj = "2a"
explain = "`terraform init -upgrade` picks the newest versions allowed by your constraints and updates the lock file."

[[stages.questions]]
type = "single"
q = "What does `source = \"hashicorp/random\"` expand to?"
options = [
  "github.com/hashicorp/random",
  "registry.terraform.io/hashicorp/random",
  "releases.hashicorp.com/random",
  "app.terraform.io/hashicorp/random",
]
answer = 1
obj = "2a"
explain = "The default hostname is the public registry: `registry.terraform.io/<namespace>/<type>`."

[[stages.questions]]
type = "single"
q = "Where do you constrain the version of the Terraform CLI itself?"
options = [
  "`provider \"terraform\" { version = ... }`",
  "`required_version` inside the `terraform` block",
  "In `.terraform.lock.hcl`",
  "With the `TF_VERSION` environment variable",
]
answer = 1
obj = "2a"
explain = "`terraform { required_version = \">= 1.5\" }`. Terraform refuses to run if its version doesn't match."

[[stages.questions]]
type = "single"
q = "Does `.terraform.lock.hcl` lock module versions?"
options = ["Yes, both providers and modules", "No, it only tracks providers", "Only registry modules", "Only Git modules"]
answer = 1
obj = "2a"
explain = "The lock file covers **providers only**. Pin module versions with the `version` argument (registry) or `?ref=` (Git)."

[[stages]]
id = "lab1"
title = "Lab: Pin your providers"
lesson = '''
Unpinned providers mean a teammate could get a different (maybe breaking) version tomorrow. Let's pin them.
'''
[stages.lab]
goal = '''
1. In `versions.tf`, add `required_version = ">= 1.5.0"` to the `terraform` block.
2. Pin **random** to `"~> 3.0"` and **local** to `"~> 2.0"` (add a `version` argument to each).
3. Run `terraform init`, then open the generated `.terraform.lock.hcl` tab and look at what it recorded.
4. Run `terraform apply`.
'''
suggested = ["terraform init", "terraform providers", "terraform plan", "terraform apply"]
hints = [
  "Each provider entry is an object: `random = { source = \"hashicorp/random\", version = \"~> 3.0\" }`.",
  "`required_version` goes directly inside `terraform { ... }`, not inside `required_providers`.",
]
[stages.lab.files]
"versions.tf" = '''
terraform {
  required_providers {
    random = {
      source = "hashicorp/random"
    }
    local = {
      source = "hashicorp/local"
    }
  }
}
'''
"main.tf" = '''
resource "random_pet" "project" {
  length = 2
}

resource "local_file" "project" {
  filename = "project.txt"
  content  = "Project codename: ${random_pet.project.id}"
}
'''
[[stages.lab.checks]]
type = "config_regex"
pattern = 'required_version\s*=\s*">=\s*1\.5(\.0)?"'
msg = "`required_version = \">= 1.5.0\"` is set"
[[stages.lab.checks]]
type = "config_regex"
pattern = 'random\s*=\s*\{[^}]*version\s*=\s*"~>\s*3\.0"'
msg = "random is pinned to `~> 3.0`"
[[stages.lab.checks]]
type = "config_regex"
pattern = 'local\s*=\s*\{[^}]*version\s*=\s*"~>\s*2\.0"'
msg = "local is pinned to `~> 2.0`"
[[stages.lab.checks]]
type = "lockfile"
provider = "registry.terraform.io/hashicorp/random"
msg = "Lock file records the random provider"
[[stages.lab.checks]]
type = "lockfile"
provider = "~> 2.0"
msg = "Lock file was refreshed with your new constraints (re-run `terraform init`)"
[[stages.lab.checks]]
type = "resource"
address = "local_file.project"
msg = "Configuration applied"

[[stages]]
id = "s3"
title = "Multiple providers & aliases"
lesson = '''
A configuration can use as many providers as it needs:

```hcl
terraform {
  required_providers {
    aws        = { source = "hashicorp/aws", version = "~> 5.0" }
    cloudflare = { source = "cloudflare/cloudflare", version = "~> 4.0" }
  }
}
```

### Same provider, different settings: `alias`
Need resources in **two AWS regions**? Declare the provider twice, giving the second an `alias`:

```hcl
provider "aws" {
  region = "eu-central-1"          # default configuration (no alias)
}

provider "aws" {
  alias  = "us"
  region = "us-east-1"
}

resource "aws_s3_bucket" "logs_eu" {
  bucket = "my-logs-eu"            # uses the default provider
}

resource "aws_s3_bucket" "logs_us" {
  provider = aws.us                # <PROVIDER>.<ALIAS>
  bucket   = "my-logs-us"
}
```

- A resource without a `provider` argument uses the **default** (un-aliased) configuration.
- Reference an alias as `aws.us`, **without quotes**.
- Passing aliases into a module: `providers = { aws = aws.us }`.

### How Terraform picks the provider for a resource
By default it takes the prefix of the resource type: `aws_s3_bucket` → `aws`. The local name in `required_providers` (here `aws`) is what that prefix matches.
'''

[[stages.questions]]
type = "single"
q = "You need resources in two AWS regions in one configuration. What do you use?"
options = ["Two separate Terraform installations", "A second `provider \"aws\"` block with an `alias`", "Workspaces", "The `region` meta-argument on each resource"]
answer = 1
obj = "2c"
explain = "Provider **aliases** let you have several configurations of the same provider."

[[stages.questions]]
type = "fill"
q = "Complete the argument so this resource uses the aliased provider: `provider = ________`"
code = '''
provider "google" {
  alias  = "europe"
  region = "europe-west1"
}

resource "google_storage_bucket" "eu" {
  provider = ________
  name     = "my-eu-bucket"
  location = "EU"
}
'''
answer = ["google.europe"]
obj = "2c"
explain = "Reference it as `<provider name>.<alias>`, without quotes: `google.europe`."

[[stages.questions]]
type = "single"
q = "A resource has no `provider` argument and there are two `aws` provider blocks, one with `alias = \"west\"` and one without. Which does it use?"
options = ["The aliased one", "The one without an alias (the default)", "Terraform picks randomly", "It's an error"]
answer = 1
obj = "2c"
explain = "Resources use the **default** (un-aliased) provider configuration unless you set `provider = aws.west`."

[[stages.questions]]
type = "single"
q = "How do you pass an aliased provider into a child module?"
options = [
  "`provider = aws.west` inside the module block",
  "`providers = { aws = aws.west }` inside the module block",
  "Modules always inherit every alias automatically",
  "Set `TF_PROVIDER_ALIAS`",
]
answer = 1
obj = "2c"
explain = "The `providers` map in a `module` block maps the child's provider names to the parent's configurations."

[[stages.questions]]
type = "multi"
q = "Which statements are true about using multiple providers? (choose 2)"
options = [
  "Different providers can be used in the same configuration",
  "Each provider needs its own state file",
  "Resources from different providers can reference each other",
  "You can only use one provider per `terraform apply`",
]
answer = [0, 2]
obj = "2c"
explain = "All providers share one configuration, one graph and one state."

