q = "An output is marked `sensitive = true`. Which command will still show its real value?"
options = ["`terraform output`", "`terraform output -json`", "`terraform plan`", "`terraform validate`"]
answer = 1
obj = "4c"
explain = "`terraform output` shows `<sensitive>`, but `-json` (and `-raw <name>`) print the actual value."

