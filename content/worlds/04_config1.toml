q = "Which ways can you supply a value for a variable named `token`? (choose 3)"
options = ["`TF_VAR_token` environment variable", "`-var 'token=...'`", "A `*.auto.tfvars` file", "`TOKEN` environment variable", "`terraform.lock.hcl`"]
answer = [0, 1, 2]
