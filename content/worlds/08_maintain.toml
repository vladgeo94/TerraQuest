[[stages.questions]]
type = "single"
q = "Which command displays the human-readable contents of the whole current state?"
options = ["`terraform show`", "`terraform state list`", "`terraform output`", "`terraform validate`"]
answer = 0
obj = "7b"
explain = "`terraform show` (`state list` only lists addresses)."

[[stages.questions]]
type = "single"
q = "You need to send HashiCorp support the most detailed logs of a failing `terraform apply`. What do you set?"
