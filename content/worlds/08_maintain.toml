q = "A module was refactored and `aws_s3_bucket.this` moved to `module.storage.aws_s3_bucket.this`. How do you avoid re-creating the bucket?"
options = [
  "`terraform apply -replace`",
  "Add `moved { from = aws_s3_bucket.this  to = module.storage.aws_s3_bucket.this }`",
  "`terraform import` again",
  "`ignore_changes = all`",
]
answer = 1
obj = "7b"
