[[stages.questions]]
type = "multi"
q = "Which are true about the `terraform import` **CLI command**? (choose 2)"
options = [
  "It requires the resource block to already exist in configuration",
  "It modifies state immediately, without a reviewable plan",
  "It can generate configuration automatically",
  "It imports every resource in the cloud account",
]
answer = [0, 1]
