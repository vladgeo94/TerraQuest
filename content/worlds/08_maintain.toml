[[stages.questions]]
type = "single"
q = "What does `terraform state rm aws_instance.old` do to the real EC2 instance?"
options = ["Terminates it", "Nothing; Terraform just forgets about it", "Stops it", "Tags it as unmanaged"]
answer = 1
obj = "7b"
